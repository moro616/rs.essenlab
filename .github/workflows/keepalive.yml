# ═══════════════════════════════════════════════════════════════════════
#  Keep-alive de la base Supabase de R&S Essence Lab
#  Proyecto: rs-essence-lab (wlgwqkorjufloshuthhn)
#
#  El plan gratuito de Supabase pausa el proyecto tras 7 días sin
#  actividad. Este workflow llama cada 3 horas a la función keepalive_ping(),
#  que escribe la fecha en la tabla keepalive: actividad real en la base
#  (ver 03-keepalive.sql). Solo da verde si la base contesta 200.
#
#  GitHub desactiva los workflows programados si el repo pasa 60 días
#  sin actividad (eso fue lo que pasó antes). Por eso, además del ping,
#  el workflow guarda la fecha en .keepalive y la commitea: el repo
#  nunca queda inactivo.
#
#  La clave es la Publishable key PÚBLICA (la misma que está en el
#  index.html). Con RLS activo no da acceso a ningún dato.
#
#  Correrlo a mano: pestaña Actions → keepalive-supabase → Run workflow.
# ═══════════════════════════════════════════════════════════════════════
name: keepalive-supabase

on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas (8 veces por día)
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SB_URL: https://wlgwqkorjufloshuthhn.supabase.co
  SB_KEY: sb_publishable_g8TB9AIUfIEc98JJ6W8qZg_Pbf303v6

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping a Supabase
        run: |
          ok=0
          for intento in 1 2 3 4 5; do
            CODE=$(curl -sS -o resp.txt -w "%{http_code}" --max-time 30 \
              -X POST "$SB_URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SB_KEY" -H "Content-Type: application/json" \
              -d '{}' || echo 000)
            echo "Intento $intento → HTTP $CODE"
            head -c 300 resp.txt 2>/dev/null; echo
            if [ "$CODE" = "200" ]; then ok=$((ok+1)); fi
            [ "$ok" -ge 3 ] && break
            sleep 20
          done
          if [ "$ok" -lt 1 ]; then
            echo "::error::La base no registró el ping (HTTP $CODE). Si está pausada, reanudala desde supabase.com/dashboard."
            exit 1
          fi
          echo "Base despierta. Último ping registrado: $(cat resp.txt)"

      - name: Marcar actividad en el repo
        run: |
          date -u +"Último día con ping a Supabase: %Y-%m-%d" > .keepalive
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive $(date -u +%Y-%m-%d)"
          git push
